services:
  broker:
    build: ./broker
    container_name: bbs-broker
    ports:
      - "5555:5555"
      - "5556:5556"

  proxy:
    build: ./proxy
    container_name: bbs-proxy
    ports:
      - "5557:5557"
      - "5558:5558"

  servidor-1:
    build: ./server
    container_name: bbs-servidor-1
    environment:
      STATE_PATH: /data/state.json
    volumes:
      - servidor-1-data:/data
    depends_on:
      - broker
      - proxy

  servidor-2:
    build: ./server
    container_name: bbs-servidor-2
    environment:
      STATE_PATH: /data/state.json
    volumes:
      - servidor-2-data:/data
    depends_on:
      - broker
      - proxy

  cliente-1:
    build: ./client
    container_name: bbs-cliente-1
    environment:
      USER_NAME: bot-1
      BROKER_URL: tcp://broker:5555
    depends_on:
      - servidor-1
      - servidor-2

  cliente-2:
    build: ./client
    container_name: bbs-cliente-2
    environment:
      USER_NAME: bot-2
      BROKER_URL: tcp://broker:5555
    depends_on:
      - servidor-1
      - servidor-2

volumes:
  servidor-1-data:
  servidor-2-data:
