services:
  broker:
    build: ./broker
    container_name: bbs-broker
    ports:
      - "5555:5555"
      - "5556:5556"

  proxy:
    build: ./proxy
    container_name: bbs-proxy
    ports:
      - "5557:5557"
      - "5558:5558"

  referencia:
    build: ./reference
    container_name: bbs-referencia
    ports:
      - "5559:5559"

  servidor-1:
    build: ./server
    container_name: bbs-servidor-1
    environment:
      STATE_PATH: /data/state.json
      SERVER_NAME: servidor-1
    volumes:
      - servidor-1-data:/data
    depends_on:
      - broker
      - proxy
      - referencia

  servidor-2:
    build: ./server
    container_name: bbs-servidor-2
    environment:
      STATE_PATH: /data/state.json
      SERVER_NAME: servidor-2
    volumes:
      - servidor-2-data:/data
    depends_on:
      - broker
      - proxy
      - referencia

  cliente-1:
    build: ./client
    container_name: bbs-cliente-1
    environment:
      USER_NAME: bot-1
      BROKER_URL: tcp://broker:5555
      PROXY_URL: tcp://proxy:5558
    depends_on:
      - servidor-1
      - servidor-2
      - proxy

  cliente-2:
    build: ./client
    container_name: bbs-cliente-2
    environment:
      USER_NAME: bot-2
      BROKER_URL: tcp://broker:5555
      PROXY_URL: tcp://proxy:5558
    depends_on:
      - servidor-1
      - servidor-2
      - proxy

volumes:
  servidor-1-data:
  servidor-2-data:
